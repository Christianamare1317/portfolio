<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradient for modern cyan aesthetic matching portfolio accent -->
    <linearGradient id="ca-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Theme Background Tile (Rounded Squircle) -->
  <rect width="64" height="64" rx="16" fill="#0b0f19" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Monogram Logo Initials: "CA" (Christian Amare) -->
  <text
    x="32"
    y="42"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
    font-size="26"
    font-weight="800"
    fill="url(#ca-gradient)"
    text-anchor="middle"
    letter-spacing="-1"
    filter="url(#glow)"
  >CA</text>

  <!-- Glowing Accent Dot -->
  <circle cx="50" cy="18" r="3.5" fill="#38bdf8" />
</svg>
